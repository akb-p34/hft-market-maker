; Copy this file to config.ini and fill in your own values.
; Every value below is a placeholder, not a setting used in the competition.
; config.ini is listed in .gitignore. Never commit real login details.
[CONFIG]
; SHIFT login (placeholders)
username = YOUR_SHIFT_USERNAME
password = YOUR_SHIFT_PASSWORD
; path to the SHIFT client connection config file
initiator = initiator.cfg
; session length in seconds
duration = 23400
; comma-separated tickers to quote
symbols = AAPL,MSFT
; price sampling for volatility and indicators
frequency = 1
window = 60
; skip a side when |VWAP - best price| is above this (dollars)
pressure_threshold = 0.2
; how strongly order book imbalance scales order size
alpha = 0.5
